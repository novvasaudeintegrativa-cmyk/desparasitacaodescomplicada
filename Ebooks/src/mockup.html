<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mockup do e-book</title>
<style>
html,body{margin:0;background:transparent}
body{width:1500px;height:1000px;position:relative;overflow:hidden;font-family:"Outfit",system-ui,sans-serif}
.scene{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 40%}
/* cuboide do livro: --w largura, --h altura, --d espessura */
.book{position:absolute;width:var(--w);height:var(--h);transform-style:preserve-3d}
.book>div{position:absolute;backface-visibility:hidden}
.front{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/2));background:url(img/capa-render.jpg) center/cover;border-radius:2px 6px 6px 2px}
.front::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,rgba(0,0,0,.28) 0,rgba(255,255,255,.18) 2.2%,rgba(0,0,0,.10) 3.6%,transparent 8%,rgba(255,255,255,.10) 55%,transparent 80%)}
.back{width:var(--w);height:var(--h);transform:translateZ(calc(var(--d)/-2)) rotateY(180deg);background:#c4441b}
.spine{width:var(--d);height:var(--h);left:0;transform:rotateY(-90deg);transform-origin:left center;background:linear-gradient(90deg,#b93f18,#e0603a 40%,#f08a62 60%,#d9532c);display:flex;align-items:center;justify-content:center}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);color:#fff;font-weight:700;font-size:calc(var(--d)*.44);letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}
.spine span i{font-style:normal;font-weight:300;opacity:.9;margin:0 .6em}
.pages{width:var(--d);height:calc(var(--h) - 8px);top:4px;right:0;transform:rotateY(90deg);transform-origin:right center;background:repeating-linear-gradient(90deg,#fff 0 3px,#e9e1da 3px 4px);}
.ptop{width:var(--w);height:var(--d);top:0;transform:rotateX(90deg);transform-origin:top center;background:repeating-linear-gradient(0deg,#fff 0 3px,#e9e1da 3px 4px)}
.pbot{width:var(--w);height:var(--d);bottom:0;transform:rotateX(-90deg);transform-origin:bottom center;background:repeating-linear-gradient(0deg,#fff 0 3px,#e9e1da 3px 4px)}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(60,25,5,.40),rgba(60,25,5,0));filter:blur(6px)}
/* livro em pe */
#stand{--w:470px;--h:665px;--d:50px;left:150px;top:150px;transform:rotateY(-24deg) rotateX(2deg)}
#sh1{left:120px;top:800px;width:620px;height:80px}
/* livros deitados */
.lay{position:absolute;transform-style:preserve-3d}
#layA{left:760px;top:430px;transform:rotateX(62deg) rotateZ(-18deg) translateZ(0)}
#layB{left:810px;top:360px;transform:rotateX(62deg) rotateZ(-18deg) translateZ(54px)}
#layA .book,#layB .book{--w:400px;--h:566px;--d:50px;position:relative}
#sh2{left:690px;top:560px;width:640px;height:230px;transform:rotate(-18deg);opacity:.9}
</style>
</head>
<body>
<div class="scene">
  <div class="shadow" id="sh1"></div>
  <div class="shadow" id="sh2"></div>

  <div class="book" id="stand">
    <div class="back"></div><div class="spine"><span>Limpeza Intestinal em 3 dias<i>|</i>Luís Manoel</span></div><div class="pages"></div><div class="ptop"></div><div class="pbot"></div><div class="front"></div>
  </div>

  <div class="lay" id="layA"><div class="book">
    <div class="back"></div><div class="spine"><span>Limpeza Intestinal em 3 dias<i>|</i>Luís Manoel</span></div><div class="pages"></div><div class="ptop"></div><div class="pbot"></div><div class="front"></div>
  </div></div>
  <div class="lay" id="layB"><div class="book">
    <div class="back"></div><div class="spine"><span>Limpeza Intestinal em 3 dias<i>|</i>Luís Manoel</span></div><div class="pages"></div><div class="ptop"></div><div class="pbot"></div><div class="front"></div>
  </div></div>
</div>
</body>
</html>
